# Feature-branch test artifacts only. No release, deploy, or updater feed.
name: Record shop preview
on:
  push:
    branches: [codex/record-shop-v1]
    paths: ['flutter/**', '.github/workflows/record-shop-preview.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  mac-preview:
    if: github.ref == 'refs/heads/codex/record-shop-v1'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flutter/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:local
      - name: Build private Mac preview
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            npx electron-builder --mac zip --arm64 --publish never -c.extraMetadata.wfPreview=true
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac zip --arm64 --publish never -c.mac.identity=null -c.mac.notarize=false -c.extraMetadata.wfPreview=true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: record-shop-mac-preview-${{ github.run_number }}
          path: flutter/dist/*.zip
          retention-days: 7
          if-no-files-found: error
